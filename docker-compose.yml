services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ikaskude-app:latest
    container_name: ikaskude_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  app_storage:
    name: ikaskude_storage
  app_logs:
    name: ikaskude_logs
